<main>
    <section class="contact">
        <div class="contact__left">

            <div class="contact__intro" appReveal>
                <h1>Travaillons <span class="accent">ensemble</span></h1>

                <div class="contact__details">
                    <div class="contact__row">
                        <span class="contact__row-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="2" y="4" width="20" height="16" rx="2"/>
                                <path d="M2 6l10 7 10-7"/>
                            </svg>
                        </span>
                        <a href="mailto:fredy.ndzessa@fasciences-uy1.cm">fredy.ndzessa@fasciences-uy1.cm</a>
                    </div>

                    <div class="contact__row">
                        <span class="contact__row-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.68 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.32 1.85.55 2.81.68A2 2 0 0 1 22 16.92z"/>
                            </svg>
                        </span>
                        <a href="tel:+237677939020">+237 677 939 020</a>
                    </div>

                    <div class="contact__row">
                        <span class="contact__row-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.45-2.14 2.94v5.66H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/>
                            </svg>
                        </span>
                        <a href="https://www.linkedin.com/in/emmanuel-fredy-ndzessa-873996321" target="_blank" rel="noopener noreferrer">linkedin.com/in/emmanuel-fredy-ndzessa-873996321</a>
                    </div>

                    <div class="contact__row">
                        <span class="contact__row-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.57.1.78-.25.78-.55v-2.16c-3.2.7-3.88-1.35-3.88-1.35-.52-1.33-1.28-1.68-1.28-1.68-1.04-.72.08-.7.08-.7 1.15.08 1.76 1.19 1.76 1.19 1.03 1.75 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11 11 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.64 1.59.24 2.76.12 3.05.74.81 1.18 1.84 1.18 3.1 0 4.43-2.7 5.4-5.27 5.69.42.36.78 1.08.78 2.18v3.23c0 .3.2.66.79.55A11.5 11.5 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
                            </svg>
                        </span>
                        <a href="https://github.com/ton-profil" target="_blank" rel="noopener noreferrer">github.com/ton-profil</a>
                    </div>
                </div>
            </div>
            <form [formGroup]="form" class="contact__form" (ngSubmit)="submit()" appReveal [revealDelay]="120">
                <div class="form__row">
                    <div class="form__group">
                        <label for="nom">Nom complet</label>
                        <input formControlName="name" type="text" id="nom" name="nom" placeholder="John Doe">
                    </div>
                    <div class="form__group">
                        <label for="email">Adresse e-mail</label>
                        <input formControlName="email" type="email" id="email" name="email" placeholder="john@example.com">
                    </div>
                </div>

                <div class="form__group">
                    <label for="objet">Objet</label>
                    <input formControlName="objet" type="text" id="objet" name="objet" placeholder="Proposition de projet...">
                </div>

                <div class="form__group">
                    <label for="message">Message</label>
                    <textarea formControlName="message" id="message" name="message" rows="5" placeholder="Votre message..."></textarea>
                </div>
                <input formControlName="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
                <button [disabled]="status()=== 'sending'" type="submit" class="form__submit">
                    {{ status()==='sending'?"envoi..":'Envoyer le Message ' }}
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </button>
                @if (status()==='ok') {
                    <p class="ok">Message envoyé, merci !</p>
                }
                @if ((status()==='error')) {
                    <p class="error">Une Erreur est survenue.</p>
                }
            </form>

        </div>
        <div class="contact__right" appReveal [revealDelay]="60">
            <img src="/assets/images/8.jpg" alt="Emmanuel Fredy">
        </div>

    </section>
</main>
